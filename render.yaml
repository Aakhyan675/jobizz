# Render Blueprint (optional). Set env vars in the dashboard.
services:
  - type: web
    name: jobizz-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn jobizz.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: jobizz.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
